name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Shell scripts parse
        run: for f in app/*.sh scripts/*.sh; do sh -n "$f"; done
      - name: Unit tests on the device's CPU (ARMv7, under qemu)
        run: |
          # qemu-user-static on older images, qemu-user on newer ones
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1 || sudo apt-get install -y -qq qemu-user >/dev/null
          qemu=$(command -v qemu-arm-static || command -v qemu-arm)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go test -exec "$qemu" ./...
      - name: The app folder is complete
        run: |
          for f in config.json launch.sh icon.png; do [ -f "app/$f" ] || { echo "missing app/$f"; exit 1; }; done
          python3 -m json.tool app/config.json > /dev/null
      - name: Release build and package
        run: |
          VERSION=0.0.0-ci ./scripts/build.sh && ./scripts/package.sh 0.0.0-ci
          python3 -m json.tool dist/app.json > /dev/null
      - name: Runs headless against fake servers
        run: |
          go run github.com/zakijss/minideck/tools/mockhub@v1.0.0 &
          sleep 20
          openssl rand -hex 32 > /tmp/devkey
          mkdir -p /tmp/minitape /tmp/frames
          printf '{"navidrome":"pw"}' | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/devkey -out /tmp/minitape/secrets.enc
          echo '{"url":"http://127.0.0.1:4533","user":"u"}' > /tmp/minitape/settings.json
          printf '#!/bin/sh\nsleep 30\n' > /tmp/ff && chmod +x /tmp/ff
          MINIDECK_DEVKEY=/tmp/devkey MINIDECK_SOCKS=off MINIDECK_FFPLAY=/tmp/ff MINIDECK_APPDIR=/tmp/minitape \
            MINIDECK_UI_PNG=/tmp/frames/f%d.png MINIDECK_UI_KEYS=wait,a,a,wait,a,wait,menu timeout 60 go run ./cmd/minitape
          ls /tmp/frames | wc -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: screens
          path: /tmp/frames
